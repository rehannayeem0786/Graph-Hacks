services:
  - type: web
    name: graphlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_GRAPH_NAME
        value: graphlens
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-70b-instruct
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"