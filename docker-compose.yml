version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  graphlens:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=graphlens
    env_file:
      - .env
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:
